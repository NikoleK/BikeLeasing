# Base URLs for different environments
serenity {
  project.name = "BikeLeasing QA"
}

api.base.url = "https://catfact.ninja"
api.facts.path = "/facts"

web.base.url = "https://www.bikeleasing.de"

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
  }
}

headless.mode = true
chrome.switches = """--headless=new;--disable-gpu;--window-size=1920,1080;--no-sandbox"""
